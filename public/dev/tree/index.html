<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>CalClaim – Message tree</title>
  <script>
    (function () {
      var raw = location.hash.replace(/^#/, "");
      var params = new URLSearchParams(raw);
      var encoded = params.get("a");
      var dest = encoded
        ? "/dev#tree&a=" + encoded.split(",").map(encodeURIComponent).join(",")
        : "/dev#tree";
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/dev#tree">Developer → Message tree</a>.</p>
</body>
</html>
