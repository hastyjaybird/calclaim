# CalClaim on Vultr – joins Dashbird's Docker network so Caddy can reverse_proxy.
# Usage:
#   CLOUD_HOST=root@144.202.105.150 ./scripts/sync-to-cloud.sh
#
# Requires:
#   - dashbird stack already up (external network dashbird_default)
#   - Caddy site block for CALCLAIM_DOMAIN → calclaim:3000
#   - Cloudflare A record calclaim → Vultr IP (ensured by scripts/ensure-calclaim-dns.sh;
#     Proxied/orange OK — matches dashbird; requires CLOUDFLARE_API_TOKEN in .env)

services:
  calclaim:
    build: .
    container_name: calclaim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - dashbird_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dashbird_default:
    external: true
